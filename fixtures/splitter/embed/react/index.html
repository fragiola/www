<!doctype html>
<!-- The fixture embed app of www/fixtures (contract v1 §5): see app.js. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Splitter examples (react, fixture)</title>
        <script id="fixture-config" type="application/json">
            {"framework":"react","themes":{"light":"light","dark":"dark","paper":"light","terminal":"dark"},"examples":{"basic-horizontal":{"title":"Basic horizontal","layout":"fill"},"nested-groups":{"title":"Nested groups","layout":"fill"},"collapsible-sidebar":{"title":"Collapsible sidebar","layout":"fill"}}}
        </script>
        <script>
            (() => {
                const schemes = JSON.parse(document.getElementById("fixture-config").textContent).themes;
                const asked = new URLSearchParams(location.search).get("theme");
                const theme = asked && Object.hasOwn(schemes, asked) ? asked : "light";
                const html = document.documentElement;
                html.dataset.theme = schemes[theme];
                html.classList.toggle("dark", schemes[theme] === "dark");
                html.dataset.exampleTheme = theme;
            })();
        </script>
        <link rel="stylesheet" href="/splitter/embed/react/app.css" />
    </head>
    <body>
        <div id="stage" data-testid="stage"></div>
        <script type="module" src="/splitter/embed/react/app.js"></script>
    </body>
</html>
