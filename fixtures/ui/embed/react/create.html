<!doctype html>
<!-- The fixture Create page (www/fixtures, contract v1.6 §5.5): a stand-in for a project's full-page
     tool. The theme from ?theme= before the first paint; `ready` once (id "create"); `host` and
     `theme` received after it, recorded on <html> for the tests (data-host, data-example-theme,
     data-theme-messages). Its own chrome (a header linking back to the docs, in the top window)
     and a main area taller than the viewport, which scrolls inside the page, never the site's. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Create (Fragiola UI, fixture)</title>
        <script>
            (() => {
                const schemes = { light: "light", dark: "dark" };
                const asked = new URLSearchParams(location.search).get("theme");
                const theme = asked && Object.hasOwn(schemes, asked) ? asked : "light";
                const html = document.documentElement;
                html.dataset.theme = schemes[theme];
                html.classList.toggle("dark", schemes[theme] === "dark");
                html.style.colorScheme = schemes[theme];
                html.dataset.exampleTheme = theme;
            })();
        </script>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: system-ui, sans-serif;
            }
            html[data-theme="light"] body {
                background: #fff;
                color: #222;
            }
            html[data-theme="dark"] body {
                background: #1b1b1b;
                color: #eee;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            header {
                display: flex;
                gap: 16px;
                align-items: center;
                padding: 12px 16px;
                border-bottom: 1px solid currentColor;
            }
            main {
                flex: 1;
                min-height: 0;
                overflow: auto;
                padding: 16px;
            }
            .tall {
                height: 3000px;
            }
        </style>
    </head>
    <body>
        <header>
            <strong>Create</strong>
            <a href="/ui/docs/getting-started/installation/" target="_top" data-testid="create-docs-link">Docs</a>
        </header>
        <main data-testid="create-main">
            <p data-testid="create-app">The theme builder (fixture).</p>
            <div class="tall"></div>
        </main>
        <script>
            (() => {
                const schemes = { light: "light", dark: "dark" };
                const html = document.documentElement;
                const embedded = window.parent !== window;
                let messages = 0;
                window.addEventListener("message", (event) => {
                    if (event.origin !== location.origin || event.source !== window.parent) return;
                    const data = event.data;
                    if (data?.type === "fragiola:example:host") {
                        html.dataset.host = String(data.overlay);
                    } else if (data?.type === "fragiola:example:theme" && Object.hasOwn(schemes, data.theme)) {
                        html.dataset.theme = schemes[data.theme];
                        html.classList.toggle("dark", schemes[data.theme] === "dark");
                        html.style.colorScheme = schemes[data.theme];
                        html.dataset.exampleTheme = data.theme;
                        html.dataset.themeMessages = String(++messages);
                    }
                });
                if (embedded) {
                    requestAnimationFrame(() =>
                        window.parent.postMessage({ type: "fragiola:example:ready", id: "create" }, location.origin),
                    );
                }
            })();
        </script>
    </body>
</html>
