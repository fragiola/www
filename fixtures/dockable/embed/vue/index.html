<!doctype html>
<!-- The fixture embed app of www/fixtures (contract v1 §5): see app.js. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Dockable examples (vue, fixture)</title>
        <script id="fixture-config" type="application/json">
            {"framework":"vue","themes":{"light":"light","dark":"dark","paper":"light","terminal":"dark"},"examples":{"hello-layout":{"title":"Hello layout","layout":"fill"},"add-tabs":{"title":"Add tabs","layout":"fill"},"keyboard":{"title":"Keyboard","layout":"fill"}}}
        </script>
        <script>
            (() => {
                const schemes = JSON.parse(document.getElementById("fixture-config").textContent).themes;
                const asked = new URLSearchParams(location.search).get("theme");
                const theme = asked && Object.hasOwn(schemes, asked) ? asked : "light";
                const html = document.documentElement;
                html.dataset.theme = schemes[theme];
                html.classList.toggle("dark", schemes[theme] === "dark");
                html.dataset.exampleTheme = theme;
            })();
        </script>
        <link rel="stylesheet" href="/dockable/embed/vue/app.css" />
    </head>
    <body>
        <div id="stage" data-testid="stage"></div>
        <script type="module" src="/dockable/embed/vue/app.js"></script>
    </body>
</html>
