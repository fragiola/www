# Deploy fragiola.com to GitHub Pages as a static export (CONTRACT.md §9).
#
# When it runs:
#   - push to main (this repo changed);
#   - every day at 05:17 UTC (a safety net: a project that changed without dispatching);
#   - on demand (Actions → "Deploy site to GitHub Pages" → Run workflow);
#   - repository_dispatch "project-updated", sent by a project's CI after a push to its default
#     branch, with client_payload { slug, sha } (or { slug, ref }): that project is built at
#     exactly that commit.
#
# What it does:
#   1. test — Biome, TypeScript, the unit tests, and the Playwright suite against the site built
#      from fixtures/ (.sources-fixtures/: it needs no project repo), served twice: the way Pages
#      serves it, and by `serve` (clean URLs, what `npx serve out` runs);
#   2. build — clones every project of projects.json at its `ref` (or the dispatched sha) into
#      $RUNNER_TEMP/projects/<slug>, then `pnpm sources:sync --install` (in each clone: `pnpm
#      install --frozen-lockfile` with the project's own lockfile, `pnpm site:export --base /<slug>
#      --out .sources/<slug>`, and the contract checks), then `pnpm build` → out/ (which refuses
#      anything but those fresh exports);
#   3. deploy — publishes out/ to Pages.
#
# One-time setup: README.md, "Deploying".

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [project-updated]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer run waits for the one in flight rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # the whole job works on the fixtures: typecheck (fumadocs-mdx) reads them too
      FRAGIOLA_SOURCES: .sources-fixtures
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json. The projects pin the
      # same pnpm major.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm e2e:build

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e
        env:
          CI: true

      - run: pnpm e2e:serve
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      DISPATCHED_SLUG: ${{ github.event.client_payload.slug }}
      # dockable sends { slug, sha }, ui { slug, ref }: the contract does not fix the payload yet
      DISPATCHED_SHA: ${{ github.event.client_payload.sha || github.event.client_payload.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # (the runner context is not available in a job's env)
      - run: echo "FRAGIOLA_PROJECTS_DIR=$RUNNER_TEMP/projects" >> "$GITHUB_ENV"

      - name: Clone the projects
        run: |
          node -e '
            for (const p of require("./projects.json"))
              console.log([p.slug, p.repo, p.ref].join(" "));
          ' | while read -r slug repo ref; do
            if [ "$slug" = "$DISPATCHED_SLUG" ] && [ -n "$DISPATCHED_SHA" ]; then
              ref="$DISPATCHED_SHA"
            fi
            dir="$FRAGIOLA_PROJECTS_DIR/$slug"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "$repo" "$ref"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "$slug: $repo@$ref → $(git -C "$dir" rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - run: pnpm sources:sync --install

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
